<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社会科 自動採点システム v7</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#18202a}
header{background:#17212b;color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10}
h1{font-size:20px;margin:0 0 4px}.sub{opacity:.75;font-size:12px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd}
nav button{white-space:nowrap;border:0;background:#eef1f4;border-radius:10px;padding:10px 13px;font-weight:700}
nav button.active{background:#17212b;color:#fff}
main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px}
button,.filebtn{border:0;border-radius:10px;padding:10px 13px;background:#17212b;color:#fff;font-weight:700}
button.secondary{background:#e9edf1;color:#17212b}button.danger{background:#b42318}
input[type=text],input[type=number]{width:100%;padding:10px;border:1px solid #cbd2d9;border-radius:9px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#66717c}
#templateWrap{position:relative;display:inline-block;max-width:100%;touch-action:none}
#templateImg{max-width:100%;display:block}
.marker{position:absolute;border:2px solid #0b7a75;background:rgba(11,122,117,.10);pointer-events:none}
.marker span{position:absolute;left:0;top:-24px;background:#0b7a75;color:#fff;border-radius:6px;padding:2px 6px;font-size:12px}
.result{display:grid;grid-template-columns:150px 1fr;gap:12px;border-top:1px solid #eee;padding:12px 0}
.result img{width:150px;border-radius:8px;border:1px solid #ddd}.ok{color:#087443;font-weight:800}.ng{color:#b42318;font-weight:800}.review{color:#9a6700;font-weight:800}
progress{width:100%;height:14px}
@media(max-width:650px){.row{grid-template-columns:1fr}.result{grid-template-columns:100px 1fr}.result img{width:100px}}
</style>
</head>
<body>
<header><h1>社会科 自動採点システム v7</h1><div class="sub">テンプレートとの差分＋複数のOCR前処理で、答案文字をできるだけ正確に認識します</div></header>
<nav>
<button class="active" data-tab="setup">①問題を登録</button>
<button data-tab="answer">②答案を選択</button>
<button data-tab="grade">③自動採点</button>
</nav>
<main>
<section id="setup" class="tab">
<div class="card">
<h2>問題用紙を登録</h2>
<p class="small">空欄の下線を自動検出します。まずは何も書いていない問題用紙を選んでください。</p>
<input id="templateFile" type="file" accept="image/*">
<div style="height:10px"></div>
<button id="detectBtn">空欄を自動検出</button>
<button id="sampleBtn" class="secondary">サンプルを読み込む</button>
<p id="detectMsg" class="small"></p>
</div>
<div class="card">
<div id="templateWrap"><img id="templateImg"></div>
</div>
<div class="card">
<h2>検出した空欄</h2>
<p class="small">自動検出後、各空欄の正解を入力してください。検出が不要な線は削除できます。</p>
<div id="blanks"></div>
<button id="saveTemplate">テンプレートを保存</button>
<button id="exportTemplate" class="secondary">テンプレートを書き出す</button>
<label class="filebtn secondary" style="display:inline-block;color:#17212b">テンプレートを読み込む<input id="importTemplate" type="file" accept=".json" hidden></label>
</div>
</section>

<section id="answer" class="tab" hidden>
<div class="card">
<h2>答案写真</h2>
<input id="answerFiles" type="file" accept="image/*" multiple>
<p class="small">問題用紙と同じ向き・ページ全体が写っている写真が最も正確です。</p>
<div id="answerPreview"></div>
</div>
</section>

<section id="grade" class="tab" hidden>
<div class="card">
<h2>自動採点</h2>
<p class="small">答案画像をテンプレートの位置に合わせ、各空欄だけをOCRします。OCR信頼度が低いものは勝手に×にせず「要確認」にします。</p>
<button id="gradeBtn">自動採点を開始</button>
<div id="progressBox" style="margin-top:10px"></div>
<div id="results"></div>
</div>
</section>
</main>

<script>
let templateData = JSON.parse(localStorage.getItem("ss_grader_v3")||localStorage.getItem("ss_grader_v2")||"null");
let answerImages=[];

const $=id=>document.getElementById(id);
const tabs=document.querySelectorAll("nav button");
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tab").forEach(s=>s.hidden=s.id!==b.dataset.tab);});

function loadImage(file){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>resolve(im);im.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
}
function canvasOf(img){
 const c=document.createElement("canvas");c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
 c.getContext("2d").drawImage(img,0,0);return c;
}
function showTemplate(data){
 $("templateImg").src=data.image;
 $("templateWrap").style.width="auto";
 renderMarkers(data.blanks||[]);
 renderBlankEditor(data.blanks||[]);
}
function renderMarkers(blanks){
 $("templateWrap").querySelectorAll(".marker").forEach(x=>x.remove());
 blanks.forEach((b,i)=>{
  const d=document.createElement("div");d.className="marker";
  d.style.left=(b.x*100)+"%";d.style.top=(b.y*100)+"%";d.style.width=(b.w*100)+"%";d.style.height=(b.h*100)+"%";
  d.innerHTML="<span>"+(i+1)+"</span>";$("templateWrap").appendChild(d);
 });
}
function renderBlankEditor(blanks){
 $("blanks").innerHTML="";
 blanks.forEach((b,i)=>{
  const d=document.createElement("div");d.className="card";d.style.margin="8px 0";
  d.innerHTML=`<b>空欄 ${i+1}</b><div class="row" style="margin-top:8px">
  <div><label class="small">問題番号</label><input type="text" data-k="id" value="${esc(b.id||String(i+1))}"></div>
  <div><label class="small">正解</label><input type="text" data-k="answer" value="${esc(b.answer||"")}"></div>
  </div>
  <div style="margin-top:8px"><label class="small">別解（カンマ区切り）</label><input type="text" data-k="aliases" value="${esc((b.aliases||[]).join(","))}"></div>
  <div style="margin-top:8px"><button class="danger del">この空欄を削除</button></div>`;
  d.querySelector(".del").onclick=()=>{templateData.blanks.splice(i,1);showTemplate(templateData)};
  d.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{
    const k=inp.dataset.k;templateData.blanks[i][k]=k==="aliases"?inp.value.split(",").map(s=>s.trim()).filter(Boolean):inp.value;
  });
  $("blanks").appendChild(d);
 });
}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}

$("templateFile").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const im=await loadImage(f);const c=canvasOf(im);templateData={image:c.toDataURL("image/jpeg",.88),w:c.width,h:c.height,blanks:[]};showTemplate(templateData);
 $("detectMsg").textContent="画像を読み込みました。「空欄を自動検出」を押してください。";
};
$("sampleBtn").onclick=async()=>{
 const r=await fetch("sample_template.jpg");const blob=await r.blob();const im=await loadImage(new File([blob],"sample.jpg",{type:blob.type}));
 const c=canvasOf(im);templateData={image:c.toDataURL("image/jpeg",.88),w:c.width,h:c.height,blanks:[]};showTemplate(templateData);
 $("detectMsg").textContent="サンプルを読み込みました。";
};
$("detectBtn").onclick=async()=>{
 if(!templateData){alert("先に問題用紙を選んでください。");return}
 $("detectMsg").textContent="空欄を検出しています…";
 try{
  const im=await loadImage(dataURLtoFile(templateData.image,"t.jpg"));const c=canvasOf(im);
  let lines=detectLines(c);
  // Long horizontal lines are likely answer blanks on this worksheet format.
  lines=mergeLines(lines).filter(x=>x.w>0.12 && x.w<0.55 && x.y>0.10 && x.y<0.92);
  lines.sort((a,b)=>a.y-b.y);
  templateData.blanks=lines.map((x,i)=>({id:String(i+1),answer:"",aliases:[],x:x.x,y:Math.max(0,x.y-0.028),w:x.w,h:0.065}));
  showTemplate(templateData);
  $("detectMsg").textContent=`${templateData.blanks.length}個の候補を検出しました。不要なものは削除し、正解を入力してください。`;
 }catch(e){console.error(e);$("detectMsg").textContent="自動検出に失敗しました。画像を明るく、まっすぐ撮影して再試行してください。";}
};
function dataURLtoFile(data,name){const [a,b]=data.split(",");const mime=a.match(/:(.*?);/)[1];const bin=atob(b);let u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:mime})}
function detectLines(c){
 // Pure JS fallback: scan grayscale for long runs of dark pixels.
 const ctx=c.getContext("2d"), sw=1200, scale=sw/c.width, sh=Math.round(c.height*scale);
 const t=document.createElement("canvas");t.width=sw;t.height=sh;t.getContext("2d").drawImage(c,0,0,sw,sh);
 const im=t.getContext("2d").getImageData(0,0,sw,sh), d=im.data, rows=[];
 for(let y=0;y<sh;y++){
   let runs=[];let start=-1;
   for(let x=0;x<sw;x++){
    const i=(y*sw+x)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    const dark=g<120;
    if(dark&&start<0)start=x;
    if((!dark||x===sw-1)&&start>=0){let end=x; if(end-start>120)runs.push([start,end]);start=-1;}
   }
   if(runs.length) rows.push({y,runs});
 }
 let out=[];
 for(const r of rows) for(const [x1,x2] of r.runs){
   if(!out.length||r.y-out[out.length-1].yy>3) out.push({x:x1/sw,y:r.y/sh,w:(x2-x1)/sw,yy:r.y});
   else {
    const q=out[out.length-1]; if(Math.abs(q.x-x1/sw)<.04&&Math.abs(q.w-(x2-x1)/sw)<.08){q.w=Math.max(q.w,(x2-x1)/sw);q.yy=r.y;}
   }
 }
 return out.map(x=>({x:x.x,y:x.y,w:x.w}));
}
function mergeLines(lines){
 const a=[];for(const l of lines){const q=a.find(z=>Math.abs(z.y-l.y)<.012&&Math.abs(z.x-l.x)<.05);if(q){q.y=(q.y+l.y)/2;q.w=Math.max(q.w,l.w)}else a.push({...l});}return a;
}

$("saveTemplate").onclick=()=>{if(!templateData){alert("テンプレートがありません");return}localStorage.setItem("ss_grader_v3",JSON.stringify(templateData));alert("保存しました。")};
$("exportTemplate").onclick=()=>{
 if(!templateData){alert("テンプレートがありません");return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(templateData)],{type:"application/json"}));a.download="社会科テンプレート.json";a.click();
};
$("importTemplate").onchange=async e=>{const f=e.target.files[0];if(!f)return;templateData=JSON.parse(await f.text());showTemplate(templateData);};

$("answerFiles").onchange=async e=>{
 answerImages=[];$("answerPreview").innerHTML="";
 for(const f of e.target.files){const im=await loadImage(f);answerImages.push({name:f.name,im});const img=document.createElement("img");img.src=im.src;img.style.maxWidth="180px";img.style.margin="6px";img.style.borderRadius="8px";$("answerPreview").appendChild(img)}
};

function cropForBlank(canvas,b,pad=0){
 const x=Math.max(0,Math.floor((b.x-pad)*canvas.width));
 const y=Math.max(0,Math.floor((b.y-pad)*canvas.height));
 const right=Math.min(canvas.width,Math.ceil((b.x+b.w+pad)*canvas.width));
 const bottom=Math.min(canvas.height,Math.ceil((b.y+b.h+pad)*canvas.height));
 const w=Math.max(20,right-x),h=Math.max(20,bottom-y);
 const c=document.createElement("canvas");c.width=w;c.height=h;
 c.getContext("2d").drawImage(canvas,x,y,w,h,0,0,w,h);return c;
}
function extractHandwriting(templateCrop,answerCrop){
 const W=480,H=140;
 const tc=document.createElement("canvas"),ac=document.createElement("canvas");
 tc.width=ac.width=W;tc.height=ac.height=H;
 const tctx=tc.getContext("2d"),actx=ac.getContext("2d");
 tctx.fillStyle="#fff";tctx.fillRect(0,0,W,H);actx.fillStyle="#fff";actx.fillRect(0,0,W,H);
 tctx.drawImage(templateCrop,0,0,W,H); actx.drawImage(answerCrop,0,0,W,H);
 const td=tctx.getImageData(0,0,W,H).data, ad=actx.getImageData(0,0,W,H).data;
 const out=document.createElement("canvas");out.width=W;out.height=H;
 const od=out.getContext("2d").createImageData(W,H);
 for(let i=0;i<ad.length;i+=4){
   const tg=.299*td[i]+.587*td[i+1]+.114*td[i+2];
   const ag=.299*ad[i]+.587*ad[i+1]+.114*ad[i+2];
   const red=ad[i]-((ad[i+1]+ad[i+2])/2);
   // 差分を広めに拾う。撮影条件の違いで印刷線が少しズレても、答案側の追加文字を残す。
   const diff=Math.max(0,tg-ag);
   const keepBlack=ag<205 && (tg>225 || diff>22);
   const keepRed=red>20 && ag<245;
   const v=(keepBlack||keepRed)?0:255;
   od.data[i]=od.data[i+1]=od.data[i+2]=v;od.data[i+3]=255;
 }
 // 孤立点を除去しつつ、細い手書き線は残す。
 const src=od.data,tmp=new Uint8ClampedArray(src);
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
   const p=(y*W+x)*4;
   if(src[p]===0){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(src[((y+dy)*W+x+dx)*4]===0)n++;if(n<2)tmp[p]=tmp[p+1]=tmp[p+2]=255;}
 }
 od.data.set(tmp);out.getContext("2d").putImageData(od,0,0);
 const up=document.createElement("canvas");up.width=W*2;up.height=H*2;
 const u=up.getContext("2d");u.fillStyle="#fff";u.fillRect(0,0,up.width,up.height);u.imageSmoothingEnabled=false;u.drawImage(out,0,0,up.width,up.height);
 return up;
}
function makeOcrVariants(hand, answerCrop){
 const variants=[];
 // 1. テンプレートとの差分画像（印刷文字を最も除外しやすい）
 variants.push({name:"差分",canvas:hand,psm:"7"});
 // 2. 差分画像を少し太らせた版。細い手書き・細い活字に強い。
 const thick=document.createElement("canvas");thick.width=hand.width;thick.height=hand.height;
 const tx=thick.getContext("2d");tx.fillStyle="#fff";tx.fillRect(0,0,thick.width,thick.height);tx.drawImage(hand,0,0);
 const src=tx.getImageData(0,0,thick.width,thick.height), d=src.data, copy=new Uint8ClampedArray(d);
 for(let y=1;y<thick.height-1;y++)for(let x=1;x<thick.width-1;x++){
   const p=(y*thick.width+x)*4;if(d[p]===0){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const q=((y+dy)*thick.width+x+dx)*4;copy[q]=copy[q+1]=copy[q+2]=0;}}
 }
 src.data.set(copy);tx.putImageData(src,0,0);variants.push({name:"太線",canvas:thick,psm:"7"});
 // 3. 答案そのものの白黒版。差分で文字が欠けた場合の保険。
 const raw=document.createElement("canvas");raw.width=480;raw.height=140;const rx=raw.getContext("2d");rx.fillStyle="#fff";rx.fillRect(0,0,480,140);rx.drawImage(answerCrop,0,0,480,140);
 const rd=rx.getImageData(0,0,480,140), a=rd.data;
 for(let i=0;i<a.length;i+=4){const g=.299*a[i]+.587*a[i+1]+.114*a[i+2];const red=a[i]-((a[i+1]+a[i+2])/2);const ink=(g<185||red>25);const v=ink?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255;}
 rx.putImageData(rd,0,0);variants.push({name:"原画像",canvas:raw,psm:"7"});
 return variants;
}
function norm(s){return String(s||"").replace(/[ 　\t\r\n。、，,．.・「」『』（）()]/g,"").toLowerCase().replace(/[ーｰ]/g,"-");}
function accepted(b){return [b.answer,...(b.aliases||[])].map(norm).filter(Boolean)}

$("gradeBtn").onclick=async()=>{
 if(!templateData?.blanks?.length){alert("先にテンプレートと空欄を登録してください。");return}
 if(!answerImages.length){alert("答案写真を選択してください。");return}
 $("results").innerHTML="";$("progressBox").innerHTML="<progress id='pg' value='0' max='1'></progress><div id='pt'>OCR準備中…</div>";
 const worker=await Tesseract.createWorker("jpn");
 await worker.setParameters({
   tessedit_pageseg_mode:"7",
   preserve_interword_spaces:"0"
 });
 const all=[];
 window.__gradeAll = all;
 for(let ai=0;ai<answerImages.length;ai++){
   const c=canvasOf(answerImages[ai].im);
   const templateCanvas=canvasOf(await loadImage(dataURLtoFile(templateData.image,"template.jpg")));
   for(let i=0;i<templateData.blanks.length;i++){
     $("pt").textContent=`${answerImages[ai].name}：${i+1}/${templateData.blanks.length}`;
     const b=templateData.blanks[i];
     const templateCrop=cropForBlank(templateCanvas,b,.008);
     const answerCrop=cropForBlank(c,b,.008);
     const hand=extractHandwriting(templateCrop,answerCrop);
     // 差分がほとんど無い空欄はOCRしない。これで空欄が多いほど大幅に高速化。
     const hd=hand.getContext("2d").getImageData(0,0,hand.width,hand.height).data;
     let ink=0;
     for(let p=0;p<hd.length;p+=4) if(hd[p]<180) ink++;
     const inkRatio=ink/(hand.width*hand.height);
     let text="", conf=0, bestName="";
     if(inkRatio>=0.0012){
       const variants=makeOcrVariants(hand,answerCrop);
       const candidates=[];
       for(const v of variants){
         const res=await worker.recognize(v.canvas.toDataURL("image/png"));
         const t=res.data.text.trim().replace(/[\n\r]+/g," ").trim();
         const c=Number(res.data.confidence)||0;
         if(t) candidates.push({text:t,conf:c,name:v.name});
       }
       // 正解と一致する候補を優先。次にOCR信頼度の高い候補を採用。
       const acc=accepted(b);
       const exact=candidates.find(x=>acc.includes(norm(x.text)));
       const best=(exact&&exact.conf>=45)?exact:candidates.sort((a,z)=>z.conf-a.conf)[0];
       if(best){text=best.text;conf=best.conf;bestName=best.name;}
     }
     const ok=accepted(b).includes(norm(text));
     let status=conf<60?"要確認":(ok?"○":"×");
     all.push({file:answerImages[ai].name,b,text,conf,status,method:bestName,img:hand.toDataURL("image/png")});
     $("pg").value=(all.length)/(answerImages.length*templateData.blanks.length);
   }
 }
 await worker.terminate();
 renderResults(all);
};
function updateScore(all){
 const total=all.length, correct=all.filter(r=>r.status==="○").length, review=all.filter(r=>r.status==="要確認").length;
 let box=document.getElementById("scoreBox");
 if(!box){box=document.createElement("div");box.id="scoreBox";box.className="card";document.getElementById("results").prepend(box);}
 box.innerHTML=`<h3 style="margin-top:0">採点結果</h3><div style="font-size:24px;font-weight:800">${correct} / ${total} 問正解</div><div class="small">要確認：${review}問　／　×：${total-correct-review}問</div>`;
}
function setManualStatus(idx,status){
 const all=window.__gradeAll||[]; if(!all[idx])return; all[idx].status=status; renderResults(all);
 const el=document.querySelector(`[data-result-index="${idx}"]`); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}
function editRecognition(idx){
 const all=window.__gradeAll||[]; const r=all[idx]; if(!r)return;
 const v=prompt(`問題 ${r.b.id} の認識結果を修正してください`, r.text||"");
 if(v===null)return; r.text=v; r.conf=100; r.status=accepted(r.b).includes(norm(v))?"○":"×"; renderResults(all);
}
function renderResults(all){
 updateScore(all);
 $("results").innerHTML=`<div id="scoreBox" class="card" style="display:none"></div>`+all.map((r,i)=>`<div class="result" data-result-index="${i}"><img src="${r.img}"><div>
 <b>問題 ${esc(r.b.id)}</b>　<span class="${r.status==="○"?"ok":r.status==="×"?"ng":"review"}">${r.status}</span>
 <div>認識：<b>${esc(r.text||"（空欄）")}</b></div>
 <div>正解：${esc(r.b.answer||"未登録")}</div>
 <div class="small">OCR信頼度：${Math.round(r.conf)}%　／ ${esc(r.method||"")}　／ ${esc(r.file)}</div>
 ${r.status==="要確認"?`<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button onclick="setManualStatus(${i},'○')">○ 正解</button><button class="danger" onclick="setManualStatus(${i},'×')">× 不正解</button><button class="secondary" onclick="editRecognition(${i})">認識結果を編集</button></div>`:`<button class="secondary" style="margin-top:8px" onclick="editRecognition(${i})">認識結果を編集</button>`}
 </div></div>`).join("");
 // score card is rendered inside results; avoid the temporary hidden duplicate affecting the visible card.
 const visible=document.getElementById("results").querySelector(".card");
 if(visible) visible.remove();
 const card=document.createElement("div"); card.className="card"; card.innerHTML=`<h3 style="margin-top:0">採点結果</h3><div style="font-size:24px;font-weight:800">${all.filter(r=>r.status==="○").length} / ${all.length} 問正解</div><div class="small">要確認：${all.filter(r=>r.status==="要確認").length}問　／　×：${all.filter(r=>r.status==="×").length}問</div>`; $("results").prepend(card);
}
if(templateData)showTemplate(templateData);
</script>
